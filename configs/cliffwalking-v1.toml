[environment]
environment = "cliffwalking-v1"

[model]
depth = 2
W = 128

[training]
n_steps = 100000
learning_rate = 0.0005
buffer_size = 10000
gamma = 0.99
batch_size = 64
learning_starts = 1000
train_frequency = 1
gradient_steps = 1
target_update_frequency = 500
exploration_rate = 0.3
exploration_initial_eps = 1.0
exploration_final_eps = 0.05

random_seed = 0

[evaluation]
checkpoint_dir = "./checkpoints/"
