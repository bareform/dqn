[environment]
environment = "frozenlake-v1"
map_name = "4x4"

[model]
depth = 2
W = 256

[training]
n_steps = 100000
learning_rate = 0.00025
buffer_size = 10000
gamma = 0.99
batch_size = 64
learning_starts = 1000
train_frequency = 1
gradient_steps = 1
target_update_frequency = 1000
exploration_rate = 0.2
exploration_initial_eps = 1.0
exploration_final_eps = 0.05

random_seed = 0

[evaluation]
checkpoint_dir = "./checkpoints/"