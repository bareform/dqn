[environment]
environment = "mountaincar-v0"

[model]
depth = 2
W = 256

[training]
n_steps = 120000
learning_rate = 0.004
buffer_size = 10000
gamma = 0.98
batch_size = 128
learning_starts = 1000
train_frequency = 16
gradient_steps = 8
target_update_frequency = 600
exploration_rate = 0.2
exploration_initial_eps = 1.0
exploration_final_eps = 0.07

random_seed = 0

[evaluation]
checkpoint_dir = "./checkpoints/"